openapi: 3.1.0
info:
  title: Get All Scheduled Messages
  version: "2.0"
servers:
  - url: https://cliq.zoho.com
paths:
  /v2/chats/{chid}/scheduledmessages:
    get:
      summary: Retrieve all scheduled messages for a specific chat
      parameters:
        - name: chid
          in: path
          required: true
          description: Channel/chat ID whose scheduled messages are being fetched
          schema:
            type: string
