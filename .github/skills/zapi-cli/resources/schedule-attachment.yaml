openapi: 3.1.0
info:
  title: Schedule Attachment
  version: "1.0"
paths:
  /api/v1/attachments:
    post:
      summary: Upload a file attachment as a scheduled message in a chat
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: string
                  format: binary
                  description: The file to upload (multipart field name is "files"); the filename is prefixed with "1_" only when a non-empty comment is present
                id:
                  type: string
                  description: Target chat ID (chid) of the conversation
                msgid:
                  type: string
                  description: >
                    Client-generated unique message ID used for deduplication.
                    Must be the current time in milliseconds as a Unix timestamp
                    (e.g. Date().timeIntervalSince1970 * 1000, formatted as a string).
                schedule_time:
                  type: string
                  description: ISO-formatted date string (yyyyMMdd'T'HHmm'00', e.g. "20260307T090000") at which to send the attachment; mutually exclusive with schedule_status;
                schedule_status:
                  type: string
                  description: Named schedule status used when schedule_time is absent; one of "check_in", "check_out", "user_available", "call_end"
                schedule_timezone:
                  type: string
                  description: IANA timezone identifier for the scheduled time (e.g. "Asia/Kolkata"); taken from TimeZone.identifier
                reply_to:
                  type: string
                  description: UID of the message being replied to; only sent when a reply context exists
                reply_from:
                  type: string
                  description: Chat ID of the message being replied to; only sent when reply_to is set
                add_info:
                  type: string
                  description: JSON string carrying extra metadata; only sent for voice messages with value "{\"1\":{\"is_voice\":true}}"; omitted entirely when isVoiceMessage is false or nil
                post_in_parent:
                  type: boolean
                  description: Whether to post in the parent chat if applicable; only included in the request body when true
                comment:
                  type: string
                  description: JSON string of comment text keyed by "1" with member mentions in Cliq markdown format (e.g. "{\"1\":\"<mention text>\"}"); omitted when comment is empty or nil
              required:
                - files
                - id
                - msgid
                - schedule_timezone
