openapi: 3.1.0
info:
  title: Delete Scheduled Message
  version: "2.0"
paths:
  /v2/chats/{chid}/scheduledmessages/{scheduleId}:
    delete:
      summary: Delete a single scheduled message from a chat
      parameters:
        - name: chid
          in: path
          required: true
          schema:
            type: string
          description: The chat ID that contains the scheduled message
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the scheduled message to delete
