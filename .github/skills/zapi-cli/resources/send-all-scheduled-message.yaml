openapi: 3.1.0
info:
  title: Send All Scheduled Messages
  version: "2.0"
paths:
  /v2/chats/{chid}/scheduledmessages/send:
    put:
      summary: Immediately send all scheduled messages in a chat (deliver them all now)
      parameters:
        - name: chid
          in: path
          required: true
          schema:
            type: string
          description: The chat ID whose scheduled messages should all be sent immediately
