openapi: 3.1.0
info:
  title: Set Typing Status
  version: "2.0"
paths:
  /v2/chats/{chid}/infomessages:
    post:
      summary: Publish a typing or idle status info-message to a chat
      parameters:
        - name: chid
          in: path
          required: true
          description: Channel ID (chat identifier)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                sid:
                  type: string
                  description: Session identifier; may be null
                  nullable: true
                status:
                  type: integer
                  description: >
                    Typing status code:
                    104 = typing, 110 = enteredText, 105 = idle
                  enum: [104, 110, 105]
