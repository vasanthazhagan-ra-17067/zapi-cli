openapi: 3.1.0
info:
  title: Remind Reminder User
  version: "2.0"
paths:
  /api/v2/reminders/{reminder_id}/users/{user_id}/remind:
    put:
      summary: Trigger a reminder notification for a specific user on a reminder
      parameters:
        - name: reminder_id
          in: path
          required: true
          schema:
            type: string
          description: The unique identifier of the reminder
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: The ZUID of the user to remind
