openapi: 3.1.0
info:
  title: Send Scheduled Message
  version: "2.0"
paths:
  /v2/chats/{chid}/scheduledmessages/{scheduleId}/send:
    put:
      summary: Immediately send a single scheduled message (deliver it now)
      parameters:
        - name: chid
          in: path
          required: true
          schema:
            type: string
          description: The chat ID that contains the scheduled message
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the scheduled message to send immediately
