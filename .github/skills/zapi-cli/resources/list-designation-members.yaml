openapi: 3.1.0
info:
  title: List Designation Members
  version: "2.0"

paths:
  /v2/designations/{designationId}/members:
    get:
      summary: >-
        Retrieves the list of users (members) assigned to a specific
        designation. Returns an empty array when no members are assigned.
        Requires the authenticated user to have ZohoCliq.Designations.ALL
        scope (or equivalent read scope).
      parameters:
        - name: designationId
          in: path
          required: true
          schema:
            type: string
          description: >-
            The unique LUID of the designation whose members to retrieve.
            Obtained from the "id" field in the list-designations or
            create-designation response.
