openapi: 3.1.0
info:
  title: Delete Buddy
  version: "1.0"
paths:
  /deletecontact.api:
    post:
      summary: Remove a user from the authenticated user's contacts/buddy list
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - userid
              properties:
                userid:
                  type: string
                  description: ZUID of the buddy to remove
