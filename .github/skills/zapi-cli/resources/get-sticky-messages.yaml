openapi: 3.1.0
info:
  title: Get Sticky Messages
  version: "2.0"

paths:
  /api/v2/chats/{chid}/stickymessage:
    get:
      summary: Retrieves the sticky message pinned to the specified chat.
      parameters:
        - name: chid
          in: path
          required: true
          description: The unique identifier of the chat whose sticky message is being fetched.
          schema:
            type: string
