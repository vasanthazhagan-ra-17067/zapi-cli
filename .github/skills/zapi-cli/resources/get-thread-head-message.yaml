openapi: 3.1.0
info:
  title: Get Thread Head Message
  version: "2.0"

paths:
  /api/v2/threads/{chid}/messages/main:
    get:
      summary: Retrieves the head (main) message of the specified thread.
      parameters:
        - name: chid
          in: path
          required: true
          description: The unique identifier of the thread (chat ID).
          schema:
            type: string
