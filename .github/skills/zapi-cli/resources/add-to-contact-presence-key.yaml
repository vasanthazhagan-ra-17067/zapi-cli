openapi: 3.1.0
info:
  title: Add to Contact Presence Key
  version: "2.0"
paths:
  /api/v2/presence:
    post:
      summary: Subscribe a set of user ZUIDs to the contacts presence topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_ids
                - topic
              properties:
                user_ids:
                  type: array
                  description: List of ZUIDs to add to the presence subscription
                  items:
                    type: string
                topic:
                  type: string
                  description: Presence topic identifier
                  example: contacts
