openapi: 3.1.0
info:
  title: Zoho Cliq – Add Message Reaction
  version: "2.0"

paths:
  /api/v2/chats/{chid}/messages/{msgUid}/reactions:
    post:
      summary: Add an emoji reaction to a chat message
      parameters:
        - name: chid
          in: path
          required: true
          description: The unique identifier of the chat channel
          schema:
            type: string
        - name: msgUid
          in: path
          required: true
          description: The unique identifier of the message being reacted to
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emoji_code
              properties:
                emoji_code:
                  type: string
                  description: The emoji reaction code to add to the message
                is_linked_message:
                  type: boolean
                  description: >
                    Set to true when the message is a thread-linked message.
                    Omit or set to false for regular messages.
