openapi: 3.1.0
info:
  title: Join Chat Through HTTP
  version: "1.0"

paths:
  /attachsession.do:
    post:
      summary: Attach the current user to an existing chat session identified by a chat ID and optional session ID.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - chid
              properties:
                chid:
                  type: string
                  description: The unique identifier of the chat to join.
                sid:
                  type: string
                  description: Optional session ID to attach to.
