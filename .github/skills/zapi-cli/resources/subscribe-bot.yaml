openapi: 3.1.0
info:
  title: Subscribe Bot
  version: "1.0"

paths:
  /api/v1/bots/{botId}/subscribe:
    post:
      summary: Subscribe the authenticated user to a bot
      parameters:
        - name: botId
          in: path
          required: true
          description: Unique identifier of the bot to subscribe to
          schema:
            type: string
        - name: X-Consents-Version
          in: header
          required: true
          description: Consents version header (always "1")
          schema:
            type: string
            enum:
              - "1"
