openapi: 3.1.0
info:
  title: Delete Reminder
  version: "2.0"
paths:
  /api/v2/reminders/{reminderID}:
    delete:
      summary: Permanently delete a reminder by its identifier.
      parameters:
        - name: reminderID
          in: path
          required: true
          description: Unique identifier of the reminder to delete.
          schema:
            type: string
          example: "1775998001154490623"
