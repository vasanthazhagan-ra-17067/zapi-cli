openapi: 3.1.0
info:
  title: Zoho Cliq – Get User Remote Data
  version: "2.0"

paths:
  /api/v2/me:
    get:
      summary: Fetch remote user data (attendance status, department, recently-accessed departments, remote-work tools)
      parameters:
        - name: source
          in: query
          required: true
          description: Fixed sentinel value identifying this as a remote-tools data request.
          schema:
            type: string
            enum:
              - remote_tools
