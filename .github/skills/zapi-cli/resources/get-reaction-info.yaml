openapi: 3.1.0
info:
  title: Get Reaction Info
  version: "2.0"

paths:
  /api/v2/chats/{chid}/messages/{msgUid}/reactions:
    get:
      summary: Retrieve the full reaction details for a specific message in a chat.
      parameters:
        - name: chid
          in: path
          required: true
          description: The unique identifier of the chat channel.
          schema:
            type: string
        - name: msgUid
          in: path
          required: true
          description: The unique identifier of the message whose reactions are being fetched.
          schema:
            type: string
