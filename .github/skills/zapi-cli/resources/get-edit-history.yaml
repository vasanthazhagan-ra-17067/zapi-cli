openapi: 3.1.0
info:
  title: Get Edit History
  version: "2.0"

paths:
  /api/v2/chats/{chid}/transcript/{msgUid}:
    get:
      summary: Retrieves the full edit history transcript for a specific message in a chat.
      parameters:
        - name: chid
          in: path
          required: true
          description: The unique identifier of the chat or channel.
          schema:
            type: string
        - name: msgUid
          in: path
          required: true
          description: The unique identifier of the message whose edit history is being fetched.
          schema:
            type: string
