openapi: 3.1.0
info:
  title: Get Channel With OCID
  version: "1.0"

paths:
  /api/v1/channels/{ocid}:
    post:
      summary: Retrieve the details of a single Cliq channel identified by its OCID.
      parameters:
        - name: ocid
          in: path
          required: true
          description: The unique organisation-scoped identifier of the channel.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
